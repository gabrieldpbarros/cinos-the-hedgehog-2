<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cinos the Hedgehog</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas#canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 8px;
            left: 8px;
            color: #fff;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 1;
        }

        #overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            font-family: sans-serif;
            font-size: 28px;
            text-align: center;
            background: rgba(0, 0, 0, 0.55);
            z-index: 2;
            pointer-events: none;
        }

        #overlay small {
            font-size: 16px;
            margin-top: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="hud">
        </div>
        <div id="overlay"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
